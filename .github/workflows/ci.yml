name: Continuous integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect affected components
    runs-on: ubuntu-24.04
    outputs:
      server: ${{ steps.classify.outputs.server }}
      python_client: ${{ steps.classify.outputs.python_client }}
      web: ${{ steps.classify.outputs.web }}
      container: ${{ steps.classify.outputs.container }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: python .github/scripts/classify_ci_changes.py --event "$EVENT_NAME" --before "$BEFORE_SHA" --base "$BASE_SHA" --head "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  server:
    name: Django, Git, Git LFS, and end-to-end
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: apps/server/uv.lock
      - name: Verify Git LFS
        run: git lfs version
      - name: Install server dependencies
        working-directory: apps/server
        run: uv sync --frozen
      - name: Run server and cross-component tests
        run: ./apps/server/test
      - name: Publish server coverage to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          disable_search: true
          fail_ci_if_error: true
          files: apps/server/coverage.xml
          flags: server
          name: server
          use_oidc: true
      - name: Upload server coverage report
        uses: actions/upload-artifact@v7
        with:
          name: server-coverage
          path: |
            apps/server/coverage.xml
            apps/server/htmlcov
          if-no-files-found: error

  python-client:
    name: Python client (${{ matrix.python-version }})
    needs: changes
    if: needs.changes.outputs.python_client == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: clients/python/uv.lock
      - name: Verify Git LFS
        run: git lfs version
      - name: Install dependencies
        working-directory: clients/python
        run: uv sync --frozen
      - name: Run client tests
        working-directory: clients/python
        run: .venv/bin/coverage run -m unittest discover -s tests
      - name: Generate client coverage reports
        working-directory: clients/python
        run: |
          .venv/bin/coverage report --fail-under=80
          .venv/bin/coverage xml
          .venv/bin/coverage html
      - name: Publish client coverage to Codecov
        if: matrix.python-version == '3.13'
        uses: codecov/codecov-action@v7.1.1
        with:
          disable_search: true
          fail_ci_if_error: true
          files: clients/python/coverage.xml
          flags: python-client
          name: python-client
          use_oidc: true
      - name: Upload client coverage report
        uses: actions/upload-artifact@v7
        with:
          name: python-client-${{ matrix.python-version }}-coverage
          path: |
            clients/python/coverage.xml
            clients/python/htmlcov
          if-no-files-found: error

  web:
    name: Nuxt checks and build
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.4.1
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile
      - name: Check types
        working-directory: apps/web
        run: pnpm typecheck
      - name: Run component tests
        working-directory: apps/web
        run: pnpm test
      - name: Build static application
        working-directory: apps/web
        run: pnpm build

  container:
    name: Production image
    runs-on: ubuntu-24.04
    needs: [changes, server, web]
    if: >-
      always() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.container == 'true' &&
      (needs.server.result == 'success' || needs.server.result == 'skipped') &&
      (needs.web.result == 'success' || needs.web.result == 'skipped')
    env:
      NIYAN_IMAGE: niyan:ci
      NIYAN_PUBLIC_HOST: localhost
      NIYAN_OBJECT_HOST: objects.localhost
      NIYAN_ACME_EMAIL: ci@example.com
      NIYAN_HTTP_PORT: "58080"
      NIYAN_HTTPS_PORT: "58443"
      NIYAN_SECRET_KEY: ci-only-deployment-check-secret-with-more-than-fifty-characters
      NIYAN_POSTGRES_PASSWORD: ci-only-postgres-password
      NIYAN_S3_ACCESS_KEY_ID: ci-only-access-key
      NIYAN_S3_SECRET_ACCESS_KEY: ci-only-secret-key-not-a-real-credential
      NIYAN_S3_VERIFY_TLS: "false"
      NIYAN_SECURE_HSTS_SECONDS: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: niyan:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Validate Compose configuration
        run: docker compose -f deploy/compose.yml config --quiet
      - name: Test deployment bootstrap
        run: python deploy/test_install.py
      - name: Smoke-test image contents and deployment settings
        run: |
          docker run --rm --entrypoint sh niyan:ci -c 'test "$(id -u)" = 10001 && git --version && git lfs version && gunicorn --version && test -f /opt/niyan/web/index.html'
          docker run --rm \
            -e NIYAN_SECRET_KEY=ci-only-deployment-check-secret-with-more-than-fifty-characters \
            -e NIYAN_DEBUG=false \
            -e NIYAN_ALLOWED_HOSTS=niyan.example.org \
            -e NIYAN_CSRF_TRUSTED_ORIGINS=https://niyan.example.org \
            -e NIYAN_DATABASE_URL=postgresql://niyan:unused@database.invalid:5432/niyan \
            -e NIYAN_S3_BUCKET=ci-only \
            -e NIYAN_SECURE_HSTS_INCLUDE_SUBDOMAINS=true \
            -e NIYAN_SECURE_HSTS_PRELOAD=true \
            niyan:ci python manage.py check --deploy
      - name: Rehearse the self-contained deployment
        run: |
          docker compose -f deploy/compose.yml --profile tools run --rm migrate
          docker compose -f deploy/compose.yml up -d --wait
          curl --fail --silent --show-error --insecure --retry 10 --retry-all-errors --retry-delay 1 --resolve localhost:58443:127.0.0.1 https://localhost:58443/health/ready
          curl --fail --silent --show-error --insecure --max-time 5 --resolve objects.localhost:58443:127.0.0.1 https://objects.localhost:58443/status
          curl --fail --silent --show-error --insecure --request OPTIONS --resolve objects.localhost:58443:127.0.0.1 --header 'Origin: https://localhost' --header 'Access-Control-Request-Method: PUT' --header 'Access-Control-Request-Headers: content-type,x-amz-date,authorization' --dump-header /tmp/niyan-cors-headers --output /dev/null https://objects.localhost:58443/niyan/ci-object
          grep --fixed-strings 'access-control-allow-origin: https://localhost' /tmp/niyan-cors-headers
          docker compose -f deploy/compose.yml exec -T -e PYTHONWARNINGS=ignore server python manage.py shell -c "from django.conf import settings; from datasets.object_storage import S3ObjectStore; store = S3ObjectStore(settings.NIYAN_S3_CONFIGURATION); key = 'deployment-rehearsal/ci.txt'; payload = b'niyan deployment smoke test'; store.client.put_object(Bucket=store.configuration.bucket, Key=store._key(key), Body=payload); assert store.head(key).size == len(payload); assert store.client.get_object(Bucket=store.configuration.bucket, Key=store._key(key))['Body'].read() == payload; store.delete(key)"
          python deploy/test_git_pipeline.py
          docker compose -f deploy/compose.yml logs --no-color maintenance | grep --fixed-strings 'failures=0'
      - name: Preserve deployment logs after failure
        if: failure()
        run: docker compose -f deploy/compose.yml logs --no-color
      - name: Remove the deployment rehearsal
        if: always()
        run: docker compose -f deploy/compose.yml --profile tools down --volumes --remove-orphans
