name: Publish container image

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/niyan-project/niyan

jobs:
  verify:
    name: Verify release and image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Verify tag, versions, and changelog
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re
          import tomllib

          root = pathlib.Path.cwd()
          match = re.fullmatch(r'v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', os.environ['RELEASE_TAG'])
          if match is None:
              raise SystemExit('Container releases require a full vMAJOR.MINOR.PATCH tag.')
          version = os.environ['RELEASE_TAG'][1:]
          server_version = tomllib.loads((root / 'apps/server/pyproject.toml').read_text())['project']['version']
          client_version = tomllib.loads((root / 'clients/python/pyproject.toml').read_text())['project']['version']
          package_init = (root / 'clients/python/src/niyan/__init__.py').read_text()
          if server_version != version or client_version != version or f"__version__ = '{version}'" not in package_init:
              raise SystemExit(f'Tag {os.environ["RELEASE_TAG"]!r} does not match every package version.')
          if f'## [{version}]' not in (root / 'CHANGELOG.md').read_text():
              raise SystemExit(f'CHANGELOG.md has no release section for {version}.')
          installer = (root / 'deploy/install.sh').read_text()
          if f'v{version}' not in installer:
              raise SystemExit(f'deploy/install.sh does not default to release v{version}.')
          PY
      - name: Verify deployment bootstrap syntax
        run: sh -n deploy/install.sh
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: niyan:release-smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the release image
        run: |
          docker run --rm --entrypoint sh niyan:release-smoke -c 'test "$(id -u)" = 10001 && git --version && git lfs version && gunicorn --version && test -f /opt/niyan/web/index.html'
          docker compose --env-file deploy/.env.example -f deploy/compose.yml config --quiet

  publish:
    name: Publish signed multi-platform image
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: metadata
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - uses: docker/build-push-action@v7
        id: publish
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
