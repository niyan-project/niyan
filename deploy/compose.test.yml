name: niyan-tests

services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: niyan
      POSTGRES_USER: niyan
      POSTGRES_PASSWORD: niyan
    ports:
      - 127.0.0.1:${NIYAN_TEST_POSTGRES_PORT:-55432}:5432
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U niyan -d niyan"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 2s
