name: niyan

x-niyan-environment: &niyan-environment
  - NIYAN_SECRET_KEY=${NIYAN_SECRET_KEY:?Set NIYAN_SECRET_KEY in deploy/.env}
  - NIYAN_DEBUG=false
  - NIYAN_ALLOWED_HOSTS=${NIYAN_ALLOWED_HOSTS:?Set NIYAN_ALLOWED_HOSTS in deploy/.env}
  - NIYAN_CSRF_TRUSTED_ORIGINS=${NIYAN_CSRF_TRUSTED_ORIGINS:?Set NIYAN_CSRF_TRUSTED_ORIGINS in deploy/.env}
  - NIYAN_DATABASE_URL=${NIYAN_DATABASE_URL:?Set NIYAN_DATABASE_URL in deploy/.env}
  - NIYAN_GIT_ROOT=/var/lib/niyan/repositories
  - NIYAN_S3_ENDPOINT_URL
  - NIYAN_S3_REGION=${NIYAN_S3_REGION:-us-east-1}
  - NIYAN_S3_BUCKET=${NIYAN_S3_BUCKET:?Set NIYAN_S3_BUCKET in deploy/.env}
  - NIYAN_S3_ACCESS_KEY_ID
  - NIYAN_S3_SECRET_ACCESS_KEY
  - NIYAN_S3_SESSION_TOKEN
  - NIYAN_S3_ADDRESSING_STYLE=${NIYAN_S3_ADDRESSING_STYLE:-auto}
  - NIYAN_S3_SIGNATURE_VERSION=${NIYAN_S3_SIGNATURE_VERSION:-s3v4}
  - NIYAN_S3_KEY_PREFIX=${NIYAN_S3_KEY_PREFIX:-niyan}
  - NIYAN_S3_SHA256_CHECKSUMS=${NIYAN_S3_SHA256_CHECKSUMS:-false}
  - NIYAN_S3_VERIFY_TLS=${NIYAN_S3_VERIFY_TLS:-true}
  - NIYAN_BEHIND_HTTPS_PROXY=${NIYAN_BEHIND_HTTPS_PROXY:-true}
  - NIYAN_SECURE_SSL_REDIRECT=${NIYAN_SECURE_SSL_REDIRECT:-true}
  - NIYAN_SESSION_COOKIE_SECURE=${NIYAN_SESSION_COOKIE_SECURE:-true}
  - NIYAN_CSRF_COOKIE_SECURE=${NIYAN_CSRF_COOKIE_SECURE:-true}
  - NIYAN_SECURE_HSTS_SECONDS=${NIYAN_SECURE_HSTS_SECONDS:-31536000}
  - NIYAN_SECURE_HSTS_INCLUDE_SUBDOMAINS=${NIYAN_SECURE_HSTS_INCLUDE_SUBDOMAINS:-false}
  - NIYAN_SECURE_HSTS_PRELOAD=${NIYAN_SECURE_HSTS_PRELOAD:-false}
  - NIYAN_LOG_LEVEL=${NIYAN_LOG_LEVEL:-INFO}
  - NIYAN_LOG_FORMAT=json

x-niyan-service: &niyan-service
  image: ${NIYAN_IMAGE:-niyan:local}
  build:
    context: ..
  environment: *niyan-environment
  volumes:
    - git-data:/var/lib/niyan/repositories
  restart: unless-stopped
  init: true

services:
  server:
    <<: *niyan-service
    ports:
      - ${NIYAN_BIND_ADDRESS:-127.0.0.1}:${NIYAN_PORT:-8000}:8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; request = urllib.request.Request('http://127.0.0.1:8000/health/ready', headers={'X-Forwarded-Proto': 'https'}); urllib.request.urlopen(request, timeout=5).read()"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 20s

  maintenance:
    <<: *niyan-service
    command: ["python", "manage.py", "run_lfs_maintenance"]

  migrate:
    <<: *niyan-service
    command: ["python", "manage.py", "migrate", "--noinput"]
    restart: "no"
    profiles: ["tools"]

volumes:
  git-data:
