name: niyan

x-niyan-environment: &niyan-environment
  - NIYAN_SECRET_KEY=${NIYAN_SECRET_KEY:?Set NIYAN_SECRET_KEY in deploy/.env}
  - NIYAN_DEBUG=false
  - NIYAN_ALLOWED_HOSTS=${NIYAN_PUBLIC_HOST:?Set NIYAN_PUBLIC_HOST in deploy/.env}
  - NIYAN_CSRF_TRUSTED_ORIGINS=https://${NIYAN_PUBLIC_HOST:?Set NIYAN_PUBLIC_HOST in deploy/.env}
  - NIYAN_DATABASE_URL=postgresql://niyan:${NIYAN_POSTGRES_PASSWORD:?Set NIYAN_POSTGRES_PASSWORD in deploy/.env}@database:5432/niyan
  - NIYAN_GIT_ROOT=/var/lib/niyan/repositories
  - NIYAN_GIT_HTTP_MAX_REQUEST_BYTES=${NIYAN_GIT_HTTP_MAX_REQUEST_BYTES:-4294967296}
  - NIYAN_S3_ENDPOINT_URL=https://${NIYAN_OBJECT_HOST:?Set NIYAN_OBJECT_HOST in deploy/.env}
  - NIYAN_S3_REGION=${NIYAN_S3_REGION:-us-east-1}
  - NIYAN_S3_BUCKET=${NIYAN_S3_BUCKET:-niyan}
  - NIYAN_S3_ACCESS_KEY_ID=${NIYAN_S3_ACCESS_KEY_ID:?Set NIYAN_S3_ACCESS_KEY_ID in deploy/.env}
  - NIYAN_S3_SECRET_ACCESS_KEY=${NIYAN_S3_SECRET_ACCESS_KEY:?Set NIYAN_S3_SECRET_ACCESS_KEY in deploy/.env}
  - NIYAN_S3_ADDRESSING_STYLE=path
  - NIYAN_S3_SIGNATURE_VERSION=s3v4
  - NIYAN_S3_KEY_PREFIX=${NIYAN_S3_KEY_PREFIX:-niyan}
  - NIYAN_S3_SHA256_CHECKSUMS=false
  - NIYAN_S3_VERIFY_TLS=${NIYAN_S3_VERIFY_TLS:-true}
  - NIYAN_BEHIND_HTTPS_PROXY=true
  - NIYAN_SECURE_SSL_REDIRECT=true
  - NIYAN_SESSION_COOKIE_SECURE=true
  - NIYAN_CSRF_COOKIE_SECURE=true
  - NIYAN_SECURE_HSTS_SECONDS=${NIYAN_SECURE_HSTS_SECONDS:-31536000}
  - NIYAN_SECURE_HSTS_INCLUDE_SUBDOMAINS=${NIYAN_SECURE_HSTS_INCLUDE_SUBDOMAINS:-false}
  - NIYAN_SECURE_HSTS_PRELOAD=${NIYAN_SECURE_HSTS_PRELOAD:-false}
  - NIYAN_LOG_LEVEL=${NIYAN_LOG_LEVEL:-INFO}
  - NIYAN_LOG_FORMAT=json

x-niyan-service: &niyan-service
  image: ${NIYAN_IMAGE:-ghcr.io/niyan-project/niyan:0.3.0}
  build:
    context: ..
  environment: *niyan-environment
  volumes:
    - git-data:/var/lib/niyan/repositories
  restart: unless-stopped
  init: true
  depends_on:
    database:
      condition: service_healthy
    object-storage:
      condition: service_healthy

services:
  proxy:
    image: caddy:2.11.4-alpine@sha256:de23def33b17fb5d1290b0f6c2add1d70780e52341896c00a4c8a2a2fe9d355e
    environment:
      NIYAN_ACME_EMAIL: ${NIYAN_ACME_EMAIL:?Set NIYAN_ACME_EMAIL in deploy/.env}
      NIYAN_PUBLIC_HOST: ${NIYAN_PUBLIC_HOST:?Set NIYAN_PUBLIC_HOST in deploy/.env}
      NIYAN_OBJECT_HOST: ${NIYAN_OBJECT_HOST:?Set NIYAN_OBJECT_HOST in deploy/.env}
    ports:
      - ${NIYAN_HTTP_PORT:-80}:80
      - ${NIYAN_HTTPS_PORT:-443}:443
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    networks:
      default:
        aliases:
          - ${NIYAN_PUBLIC_HOST:?Set NIYAN_PUBLIC_HOST in deploy/.env}
          - ${NIYAN_OBJECT_HOST:?Set NIYAN_OBJECT_HOST in deploy/.env}
    depends_on:
      server:
        condition: service_healthy
      object-storage:
        condition: service_healthy

  database:
    image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: niyan
      POSTGRES_USER: niyan
      POSTGRES_PASSWORD: ${NIYAN_POSTGRES_PASSWORD:?Set NIYAN_POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U niyan -d niyan"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  object-storage:
    image: ghcr.io/chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    command:
      - mini
      - -dir=/data
      - -master.telemetry=false
      - -s3.allowedOrigins=https://${NIYAN_PUBLIC_HOST:?Set NIYAN_PUBLIC_HOST in deploy/.env}
      - -s3.externalUrl=https://${NIYAN_OBJECT_HOST:?Set NIYAN_OBJECT_HOST in deploy/.env}
    environment:
      AWS_ACCESS_KEY_ID: ${NIYAN_S3_ACCESS_KEY_ID:?Set NIYAN_S3_ACCESS_KEY_ID in deploy/.env}
      AWS_SECRET_ACCESS_KEY: ${NIYAN_S3_SECRET_ACCESS_KEY:?Set NIYAN_S3_SECRET_ACCESS_KEY in deploy/.env}
      S3_BUCKET: ${NIYAN_S3_BUCKET:-niyan}
    volumes:
      - seaweed-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8333/status"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    init: true

  server:
    <<: *niyan-service
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; request = urllib.request.Request('http://127.0.0.1:8000/health/ready', headers={'Host': '${NIYAN_PUBLIC_HOST:?Set NIYAN_PUBLIC_HOST in deploy/.env}', 'X-Forwarded-Proto': 'https'}); urllib.request.urlopen(request, timeout=5).read()"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 20s

  maintenance:
    <<: *niyan-service
    command: ["python", "manage.py", "run_lfs_maintenance"]
    depends_on:
      database:
        condition: service_healthy
      object-storage:
        condition: service_healthy
      proxy:
        condition: service_started

  migrate:
    <<: *niyan-service
    command: ["python", "manage.py", "migrate", "--noinput"]
    restart: "no"
    profiles: ["tools"]

volumes:
  caddy-config:
  caddy-data:
  git-data:
  postgres-data:
  seaweed-data:
