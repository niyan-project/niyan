[project]
name = "niyan"
version = "0.3.0"
description = "Niyān CLI and Python filesystem client"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Niyān contributors" },
]
keywords = ["data-version-control", "fsspec", "git-lfs", "datasets"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "fsspec>=2025.3.0",
    "keyring>=25.6.0",
]

[project.urls]
Homepage = "https://github.com/niyan-project/niyan"
Documentation = "https://github.com/niyan-project/niyan#readme"
Issues = "https://github.com/niyan-project/niyan/issues"
Source = "https://github.com/niyan-project/niyan"

[project.scripts]
niyan = "niyan.cli:main"

[project.entry-points."fsspec.specs"]
niyan = "niyan.filesystem:NiyanFileSystem"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/niyan"]

[tool.hatch.build.targets.sdist]
include = [
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
    "/src",
    "/tests",
    "/uv.lock",
]

[dependency-groups]
dev = [
    "coverage>=7.10",
    "polars>=1.0",
]

[tool.coverage.run]
branch = true
relative_files = true
source = ["niyan"]

[tool.coverage.report]
precision = 1
show_missing = true

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"
