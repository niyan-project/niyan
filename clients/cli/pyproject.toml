[project]
name = "niyan-cli"
version = "0.1.0"
description = "Standalone CLI for Niyān dataset repositories"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "keyring>=25.6.0",
]

[project.scripts]
niyan = "niyan.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/niyan"]
